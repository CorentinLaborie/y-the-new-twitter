<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Répondre à une question — Desktop</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/yds/components/bundle.css">
<script src="ds/yds/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#4f46e5}a:hover{color:#4338ca}
.y-account{margin-top:auto;display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;padding:12px 12px 12px 8px;border:0;border-radius:9999px;background:transparent;font-family:inherit;text-align:left;cursor:pointer}
.y-account:hover{background:#f3f4f6}
.y-rp-composer{display:flex;gap:12px;padding:16px 24px;border-radius:16px;background:#f8fafc}
.y-rp-composer-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.y-rp-label{font-size:13px;line-height:18px;font-weight:700;color:#1e293b}
.y-rp-input{display:block;width:100%;height:96px;box-sizing:border-box;padding:12px;border:1px solid #e2e8f0;border-radius:8px;background:#ffffff;font-family:inherit;font-size:15px;line-height:20px;color:#1e293b;resize:none}
.y-rp-input::placeholder{color:#6b7280}
.y-rp-foot{display:flex;align-items:center;justify-content:space-between;gap:12px}
.y-rp-scope{display:flex;align-items:center;gap:4px;font-size:13px;line-height:18px;font-weight:600;color:#4f46e5}
.y-rp-actions{display:flex;align-items:center;gap:12px}
</style>
</helmet>

<div style="width: 1440px; height: 1073px; box-sizing: border-box; background: #f8fafc; color: #1e293b; font-family: Inter, system-ui, sans-serif; display: flex; justify-content: flex-start; padding-left: 108px; overflow: hidden;">

<div style="flex: none; width: 275px; box-sizing: border-box; padding: 8px 23px 16px 8px; display: flex; flex-direction: column; height: 1073px;">
<div style="padding: 4px 12px 8px;"><x-import component-from-global-scope="YDS.YLogo" size="40"></x-import></div>
<nav aria-label="Navigation principale" style="display: flex; flex-direction: column; gap: 8px; margin-left: -6px;">
<x-import component-from-global-scope="YDS.NavItem" icon="home" label="Accueil" active="{{yes}}"></x-import>
<x-import component-from-global-scope="YDS.NavItem" icon="search" label="Explorer"></x-import>
<x-import component-from-global-scope="YDS.NavItem" icon="bell" label="Notifications" badge="3"></x-import>
<x-import component-from-global-scope="YDS.NavItem" icon="mail" label="Messages"></x-import>
<x-import component-from-global-scope="YDS.NavItem" icon="bookmark" label="Signets"></x-import>
<x-import component-from-global-scope="YDS.NavItem" icon="user" label="Profil"></x-import>
<x-import component-from-global-scope="YDS.NavItem" icon="circle-ellipsis" label="Plus"></x-import>
</nav>
<div style="margin-top: 24px;"><x-import component-from-global-scope="YDS.Button" variant="primary" size="lg" shape="pill" block="{{yes}}">Poster</x-import></div>
<button type="button" class="y-account" aria-label="Options du compte Corentin Laborie">
<span style="flex: none; width: 40px; height: 40px; display: flex;"><x-import component-from-global-scope="YDS.Avatar" name="Corentin Laborie" size="{{av}}"></x-import></span>
<span style="flex: 1; min-width: 0; line-height: 18px;"><span style="display: block; font-size: 15px; font-weight: 700; color: #1e293b;">Corentin Laborie</span><span style="display: block; font-size: 15px; color: #6b7280;">@corentin</span></span>
<x-import component-from-global-scope="YDS.Icon" name="ellipsis" size="18" color="#1e293b"></x-import>
</button>
</div>

<main style="flex: none; width: 600px; height: 1073px; box-sizing: border-box; border-left: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0; overflow: hidden; background: #ffffff; display: flex; flex-direction: column;">
<x-import component-from-global-scope="YDS.PageHeader" title="Question" back="{{yes}}" back-label="Retour au fil"></x-import>

<div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 0;">

<x-import component-from-global-scope="YDS.QuestionPost" author="AliceY" date="15/10/2026 08h30" tags="{{pA.tags}}" body="{{pA.body}}" reactions="{{pA.reactions}}" hide-follow="{{yes}}" y-active="{{yes}}" bookmarkable="{{yes}}"></x-import>

<section aria-label="Réponses à la question" style="display: flex; flex-direction: column; gap: 0; border-top: 1px solid #e2e8f0; padding-top: 12px;">
<h2 style="margin: 0 0 4px 0; font-size: 16px; line-height: 22px; font-weight: 700; color: #1e293b;">2 réponses</h2>
<x-import component-from-global-scope="YDS.QuestionPost" author="Robert44" date="15/10/2026 09h02" followed="{{yes}}" body="{{replyA.body}}" reactions="{{replyA.reactions}}" compact="{{yes}}"></x-import>
<x-import component-from-global-scope="YDS.QuestionPost" author="Juliette_B" date="15/10/2026 10h15" body="{{replyB.body}}" reactions="{{replyB.reactions}}" compact="{{yes}}"></x-import>
</section>

<section class="y-rp-composer" aria-label="Votre réponse">
<div style="flex: none; width: 40px; height: 40px; display: flex;"><x-import component-from-global-scope="YDS.Avatar" name="Corentin Laborie" size="{{av}}"></x-import></div>
<div class="y-rp-composer-body">
<label for="reply-d" class="y-rp-label">Votre réponse</label>
<textarea id="reply-d" class="y-rp-input" placeholder="Écrivez votre réponse…"></textarea>
<div class="y-rp-foot">
<div class="y-rp-scope"><x-import component-from-global-scope="YDS.Icon" name="globe" size="16" color="#4f46e5"></x-import><span>Réponse publique</span></div>
<div class="y-rp-actions"><x-import component-from-global-scope="YDS.CharCounter" value="0" max="280"></x-import><x-import component-from-global-scope="YDS.Button" variant="primary" size="md" disabled="{{yes}}">Répondre</x-import></div>
</div>
</div>
</section>

</div>
</main>

<div style="flex: none; width: 350px; box-sizing: border-box; padding: 8px 0 16px 24px; display: flex; flex-direction: column; gap: 16px; height: 1073px; overflow: hidden;">
<x-import component-from-global-scope="YDS.SearchField" label="Rechercher une question"></x-import>
<div style="margin-top: auto;"><x-import component-from-global-scope="YDS.Footer" variant="sidebar"></x-import></div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1073}}'>
class Component extends DCLogic {
renderVals() {
return {
yes: true,
av: 40,
pA: { tags: ['#human_life'], body: '« Est-ce qu’on change vraiment d’avis, ou est-ce qu’on trouve juste de meilleures raisons de penser la même chose ? »', reactions: { like: 860, dislike: 95, y: 64 } },
replyA: { body: 'Je crois qu’on change d’avis quand on arrête de vouloir gagner la discussion.', reactions: { like: 58, dislike: 4 } },
replyB: { body: 'On change surtout d’avis quand on se sent écouté, pas quand on perd l’argument.', reactions: { like: 21, dislike: 2 } }
};
}
}
</script>
</body>
</html>
