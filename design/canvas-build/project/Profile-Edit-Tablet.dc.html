<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Modifier le profil — Tablette</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/yds/components/bundle.css">
<script src="ds/yds/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#4f46e5}a:hover{color:#4338ca}
.y-account{margin-top:auto;display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;padding:12px 12px 12px 8px;border:0;border-radius:9999px;background:transparent;font-family:inherit;text-align:left;cursor:pointer}
.y-pe-note{display:flex;align-items:flex-start;gap:12px;padding:16px;border-radius:16px;background:#e0e7ff;color:#1e293b;font-size:14px;line-height:20px}
.y-pe-note p{margin:0}
.y-pe-ico{flex:none;display:flex}
.y-pe-field{display:flex;flex-direction:column;gap:8px}
.y-pe-count{display:flex;justify-content:flex-end}
.y-pe-at{position:absolute;left:12px;top:0;height:56px;display:flex;align-items:center;font-size:15px;color:#6b7280;pointer-events:none}
.y-pe-avatar-row{position:relative;z-index:1;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:12px}
.y-pe-avatar{width:96px;height:96px;flex:none;box-sizing:border-box;padding:4px;border-radius:9999px;background:#ffffff;display:flex}
.y-pe-avatar-btn{display:flex;border-radius:9999px;background:#ffffff}
</style>
</helmet>

<div style="position: relative; width: 768px; height: 1024px; box-sizing: border-box; background: #f8fafc; color: #1e293b; font-family: Inter, system-ui, sans-serif; overflow: hidden;">

<div style="position: absolute; top: 0; left: 50%; margin-left: -300px; width: 600px; height: 1024px; box-sizing: border-box; border-left: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0; background: #ffffff; overflow: hidden;">
<div style="display: flex; align-items: center; gap: 24px; height: 53px; box-sizing: border-box; padding: 0 16px; border-bottom: 1px solid #e2e8f0;"><span style="font-size: 20px; line-height: 26px; font-weight: 800;">Corentin Laborie</span></div>
<div class="y-pe-bg-card"></div>
<div style="position: relative; padding: 12px 16px 16px; border-bottom: 1px solid #e2e8f0;">
<div style="width: 120px; height: 120px; box-sizing: border-box; margin-top: -60px; border: 4px solid #ffffff; border-radius: 9999px; background: #e0e7ff;"></div>
<div style="width: 180px; height: 22px; margin-top: 24px; border-radius: 8px; background: #e2e8f0;"></div>
<div style="width: 110px; height: 16px; margin-top: 8px; border-radius: 8px; background: #f1f5f9;"></div>
<div style="width: 100%; height: 14px; margin-top: 16px; border-radius: 8px; background: #f1f5f9;"></div>
</div>
</div>

<div style="position: absolute; inset: 0; background: rgba(15, 23, 42, 0.5); display: flex; align-items: center; justify-content: center;">
<div role="dialog" aria-modal="true" aria-labelledby="pe-title" style="box-sizing: border-box; width: 560px; max-height: 920px; display: flex; flex-direction: column; background: #ffffff; border-radius: 16px; box-shadow: 0px 20px 40px -10px rgba(0, 0, 0, 0.3); overflow: hidden;">

<header style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 64px; box-sizing: border-box; padding: 0 16px 0 24px; border-bottom: 1px solid #e2e8f0;">
<h2 id="pe-title" style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 800; color: #1e293b;">Modifier le profil</h2>
<x-import component-from-global-scope="YDS.IconButton" icon="x" label="Fermer" tone="muted"></x-import>
</header>

<form onsubmit="return false" style="flex: 1; min-height: 0; display: flex; flex-direction: column; margin: 0;">
<div style="flex: 1; min-height: 0; overflow: auto; box-sizing: border-box; padding: 24px 24px 24px; display: flex; flex-direction: column;">

<div style="display: flex; flex-direction: column;">
<div class="y-pe-avatar-row">
<div class="y-pe-avatar"><x-import component-from-global-scope="YDS.Avatar" name="Corentin Laborie" size="88"></x-import></div>
<span class="y-pe-avatar-btn"><x-import component-from-global-scope="YDS.Button" variant="outline" size="sm" icon="image">Changer la photo</x-import></span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 16px; margin-top: 24px;">

<div class="y-pe-field">
<x-import component-from-global-scope="YDS.TextField" label="Nom affiché" hint="Affiché sur votre profil et sous vos réponses." value="Corentin Laborie"></x-import>
<div class="y-pe-count"><x-import component-from-global-scope="YDS.CharCounter" value="16" max="50"></x-import></div>
</div>

<div class="y-pe-field">
<div class="y-field">
<label class="y-field-label" for="pe-handle">Identifiant</label>
<span class="y-field-hint">Unique, sans distinction de casse.</span>
<span class="y-field-control">
<span class="y-pe-at" aria-hidden="true">@</span>
<input id="pe-handle" type="text" value="corentin" autocomplete="username" style="padding-left: 28px;">
</span>
</div>
<div class="y-pe-count"><x-import component-from-global-scope="YDS.CharCounter" value="8" max="30"></x-import></div>
</div>

<div class="y-pe-field">
<x-import component-from-global-scope="YDS.TextField" label="Bio" multiline="{{yes}}" rows="4" value="Curieux des usages du numérique, je pose les questions qu’on oublie de se poser en ligne."></x-import>
<div class="y-pe-count"><x-import component-from-global-scope="YDS.CharCounter" value="89" max="160"></x-import></div>
</div>

<div class="y-pe-note" role="note"><span class="y-pe-ico"><x-import component-from-global-scope="YDS.Icon" name="info" size="18" color="#4f46e5"></x-import></span><p>Le numéro de téléphone ne peut pas être modifié pour le moment.</p></div>

</div>
</div>

<footer style="flex: none; display: flex; justify-content: flex-end; gap: 12px; box-sizing: border-box; padding: 16px 24px; border-top: 1px solid #e2e8f0;">
<x-import component-from-global-scope="YDS.Button" variant="outline" size="md">Annuler</x-import>
<x-import component-from-global-scope="YDS.Button" variant="primary" size="md" type="submit">Enregistrer</x-import>
</footer>
</form>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":768,"height":1024}}'>
class Component extends DCLogic {
renderVals() {
return { yes: true };
}
}
</script>
</body>
</html>
