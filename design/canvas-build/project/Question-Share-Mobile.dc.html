<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Question partagée — Mobile</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/yds/components/bundle.css">
<script src="ds/yds/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#4f46e5}a:hover{color:#4338ca}
.y-qpost{padding:16px}
.y-qpost.is-compact{padding:12px 16px}
.y-qpost-who strong{font-size:14px}
.y-qpost-who span,.y-qpost-tags{font-size:12px}
.y-qpost-body{font-size:14px;line-height:20px;margin:12px 0}
.y-qpost.is-compact .y-qpost-body{font-size:14px;line-height:20px;margin:12px 0}
.y-qpost-actions{gap:8px;flex-wrap:nowrap}
.y-qpost-head{gap:12px;flex-wrap:wrap}
.y-qpost-head .y-avatar{width:36px!important;height:36px!important;font-size:14px!important}
.y-qpost-tags{width:100%;margin-left:48px;justify-content:flex-start}
.y-react{height:32px;padding:0 12px;font-size:12px;white-space:nowrap}
.y-follow{height:32px!important;font-size:12px!important}
.y-save{width:32px;height:32px}
.y-sharebar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid #e2e8f0;background:#ffffff}
.y-sharebar p{margin:0;font-size:14px;line-height:20px;font-weight:700;color:#6b7280}
.y-sharebar a{font-size:14px;line-height:20px;font-weight:700}
.y-feed{display:flex;flex-direction:column;gap:12px;padding:16px 16px 0}
</style>
</helmet>
<div style="position: relative; width: 360px; height: 667px; box-sizing: border-box; background: #ffffff; color: #1e293b; font-family: Inter, system-ui, sans-serif; overflow: hidden;">

<div style="position: absolute; top: 0; left: 0; right: 0; z-index: 1;"><x-import component-from-global-scope="YDS.MobileTopBar" back="{{yes}}" backLabel="Retour" title="Question"></x-import></div>

<main style="position: absolute; top: 53px; left: 0; right: 0; bottom: 0; overflow: hidden;">
<div class="y-sharebar" role="region" aria-label="Vue partagée">
<p>Vue partagée</p>
<a href="#">Ouvrir le fil</a>
</div>

<div class="y-feed">
<x-import component-from-global-scope="YDS.QuestionPost" author="AliceY" date="15/10/2026 08h30" tags="{{pA.tags}}" body="{{pA.body}}" reactions="{{pA.reactions}}" bookmarkable="{{yes}}">
<x-import component-from-global-scope="YDS.ConversationBox" reply-to="AliceY" size="sm">
<x-import component-from-global-scope="YDS.QuestionPost" author="MarkL" date="15/10/2026 09h02" followed="{{yes}}" body="{{replyA.body}}" reactions="{{replyA.reactions}}" compact="{{yes}}"></x-import>
</x-import>
</x-import>
</div>
</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":667}}'>
class Component extends DCLogic {
renderVals() {
return {
yes: true,
pA: { tags: ['#human_life'], body: '« Est-ce qu’on change vraiment d’avis, ou est-ce qu’on trouve juste de meilleures raisons de penser la même chose ? »', reactions: { like: 860, dislike: 95, y: 64 } },
replyA: { body: 'Je crois qu’on change d’avis quand on arrête de vouloir gagner la discussion.', reactions: { like: 58, dislike: 4 } }
};
}
}
</script>
</body>
</html>
