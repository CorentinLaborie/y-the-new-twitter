<style>
body{margin:0}

.y-back{position:absolute;top:36px;left:112px;box-sizing:border-box;min-height:32px;padding:4px 0;display:inline-flex;align-items:center;gap:8px;font-size:18px;line-height:24px;font-weight:600;color:#4f46e5;text-decoration:none}

.y-title{margin:0;font-size:32px;line-height:40px;font-weight:600;color:#1e293b;text-align:center;white-space:nowrap}
.y-accent{margin:0;font-size:40px;line-height:48px;font-weight:700;color:#4f46e5;text-align:center}

.y-legal{margin:0;font-size:12px;line-height:18px;color:#6b7280;text-align:center}
.y-legal-link,.y-legal-link:hover{color:#1e293b;font-weight:600;text-decoration:underline;white-space:nowrap}
.y-check .y-legal-link{white-space:normal}
.y-auth-footer{position:absolute;left:0;right:0;bottom:0}

        <div class="y-span-2"><x-import component-from-global-scope="YDS.TextField" label="Nom affiché (obligatoire)" hint="50 caractères maximum." placeholder="Ex.&nbsp;: Jeannot Dupont" auto-complete="name"></x-import></div>

        <x-import component-from-global-scope="YDS.TextField" label="Date de naissance" placeholder="JJ/MM/AAAA" auto-complete="bday" icon="calendar" value="11/11/2010" error="Vous devez avoir au moins 18&nbsp;ans."></x-import>
        <x-import component-from-global-scope="YDS.TextField" label="E-mail" placeholder="nom@exemple.fr" auto-complete="email" type="email" value="alex@" error="Adresse e-mail invalide."></x-import>

        <x-import component-from-global-scope="YDS.TextField" label="Mot de passe" placeholder="8&nbsp;caractères minimum" auto-complete="new-password" type="password" value="abc123" error="8&nbsp;caractères minimum."></x-import>
        <x-import component-from-global-scope="YDS.TextField" label="Confirmer le mot de passe" placeholder="Retapez votre mot de passe" auto-complete="new-password" type="password" value="abc1234" error="Les mots de passe ne correspondent pas."></x-import>

      <x-import component-from-global-scope="YDS.Button" variant="primary" size="lg" block="{{yes}}" type="submit">Créer mon compte</x-import>
    </form>
    <div class="y-auth-divider" aria-hidden="true"></div>
    <p class="y-legal">En vous inscrivant, vous acceptez nos <a href="#" class="y-legal-link">Conditions d’utilisation</a>, notre <a href="#" class="y-legal-link">Politique de confidentialité</a> et notre <a href="#" class="y-legal-link">Utilisation des cookies</a>.</p>
  </div>
  <div class="y-auth-footer"><x-import component-from-global-scope="YDS.Footer" variant="page"></x-import></div>
</div>
