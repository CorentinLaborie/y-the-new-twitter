<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Administration — Connexion bloquée</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/yds/components/bundle.css">
<script src="ds/yds/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#4f46e5}a:hover{color:#4338ca}
.a-login{width:1440px;height:900px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:64px;background:#ffffff;color:#1e293b;font-family:Inter,system-ui,sans-serif;overflow:hidden}
.a-login-brand{flex:none;line-height:0}
.a-login-col{flex:none;width:576px;display:flex;flex-direction:column;gap:24px}
.a-login-kicker{margin:0;font-size:18px;line-height:24px;font-weight:600;color:#4f46e5}
.a-login-title{margin:0;font-size:40px;line-height:48px;font-weight:600;color:#1e293b}
.a-login-form{display:flex;flex-direction:column;gap:24px;margin:0}
.a-login-alt{align-self:center;font-size:14px;line-height:20px;font-weight:600;color:#4f46e5;text-decoration:underline}
.a-login-note{margin:0;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;line-height:20px;color:#6b7280;text-align:center}
.a-shell{position:relative}
.a-h2{margin:0;font-size:18px;line-height:24px;font-weight:700;color:#1e293b}
.a-back{display:inline-flex;align-items:center;gap:8px;font-size:14px;line-height:20px;font-weight:600;color:#4f46e5;text-decoration:none}
.a-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.a-kpi{box-sizing:border-box;padding:24px;background:#ffffff;border-radius:16px;box-shadow:0px 4px 8px -1px rgba(0,0,0,0.1);display:flex;flex-direction:column;gap:8px}
.a-kpi-label{font-size:14px;line-height:20px;font-weight:600;color:#6b7280}
.a-kpi-value{font-size:40px;line-height:48px;font-weight:800;color:#1e293b}
.a-kpi-sub{font-size:13px;line-height:18px;color:#6b7280}
.a-dash{display:grid;grid-template-columns:1fr 360px;gap:24px;align-items:start}
.a-dash-side{padding:24px;display:flex;flex-direction:column;gap:16px}
.a-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px}
.a-list li{display:flex;flex-direction:column;gap:2px}
.a-list time{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12px;line-height:16px;color:#6b7280}
.a-list strong{font-size:14px;line-height:20px;color:#1e293b}
.a-list span{font-size:13px;line-height:18px;color:#6b7280}
.a-scrim{position:absolute;inset:0;background:rgba(15,23,42,0.5);display:flex;align-items:center;justify-content:center}
.a-dialog{box-sizing:border-box;width:560px;padding:32px;background:#ffffff;border-radius:16px;box-shadow:0px 20px 40px -10px rgba(0,0,0,0.3);display:flex;flex-direction:column;gap:20px;font-family:Inter,system-ui,sans-serif;color:#1e293b}
.a-dialog h2{margin:0;font-size:24px;line-height:32px;font-weight:800}
.a-dialog p{margin:0;font-size:15px;line-height:21px;color:#6b7280}
.a-dialog-hint{font-size:13px !important;line-height:18px !important}
.a-dialog-actions{display:flex;justify-content:flex-end;gap:12px}
.a-divider{height:1px;background:#e2e8f0}
.a-alert{box-sizing:border-box;display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:12px;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;font-size:14px;line-height:20px}
.a-alert div{display:flex;flex-direction:column;gap:4px}
.a-alert strong{font-weight:700}
.a-locked{display:flex;flex-direction:column;gap:24px;margin:0;padding:0;border:0;min-width:0;opacity:0.5}
</style>
</helmet>
<div class="a-login">
  <div class="a-login-brand" aria-hidden="true"><x-import component-from-global-scope="YDS.YLogo" size="480"></x-import></div>
  <div class="a-login-col">
    <p class="a-login-kicker">Administration</p>
    <h1 class="a-login-title">Connexion au back-office</h1>
    <div class="a-alert" role="alert">
      <span style="display:inline-flex;line-height:0"><x-import component-from-global-scope="YDS.Icon" name="triangle-alert" size="20" color="#dc2626"></x-import></span>
      <div><strong>Connexion bloquée</strong><span>Cinq échecs de connexion. Réessayez dans 14 min 52 s. Un e-mail d’alerte a été envoyé à l’administrateur.</span></div>
    </div>
    <form class="a-login-form" onsubmit="return false">
      <fieldset class="a-locked" disabled>
        <x-import component-from-global-scope="YDS.TextField" label="Adresse e-mail" placeholder="Votre adresse e-mail" type="email" auto-complete="username"></x-import>
        <x-import component-from-global-scope="YDS.TextField" label="Mot de passe" placeholder="Votre mot de passe" type="password" revealable="{yes}" auto-complete="current-password"></x-import>
        <x-import component-from-global-scope="YDS.TextField" label="Code de vérification à 6 chiffres" placeholder="000000" auto-complete="one-time-code"></x-import>
        <x-import component-from-global-scope="YDS.Button" variant="primary" size="lg" block="{yes}" type="submit">Se connecter</x-import>
        <a class="a-login-alt" href="#">Utiliser un code de secours</a>
      </fieldset>
    </form>
    <p class="a-login-note"><span style="display:inline-flex;line-height:0"><x-import component-from-global-scope="YDS.Icon" name="lock" size="16" color="#6b7280"></x-import></span>Connexion réservée à l’administrateur</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return { yes: true };
}
}
</script>
</body>
</html>
