<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Signaler une question, autre motif — Tablette</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/yds/components/bundle.css">
<script src="ds/yds/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#4f46e5}a:hover{color:#4338ca}
.ph{background:#ffffff;border-radius:16px;box-shadow:0px 4px 8px -1px rgba(0,0,0,0.1);padding:16px 24px;display:flex;flex-direction:column;gap:12px}
.ph-post{display:flex;gap:12px;padding:24px;border-bottom:1px solid #e2e8f0}
.ph-av{flex:none;width:40px;height:40px;border-radius:9999px;background:#f3f4f6}
.ph-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.ph-bar{height:12px;border-radius:4px;background:#f3f4f6}
.ph-bar.w40{width:40%}.ph-bar.w70{width:70%}.ph-bar.w90{width:90%}
.scrim{position:absolute;inset:0;z-index:2;background:rgba(15,23,42,0.5);display:flex;align-items:center;justify-content:center}
.dlg{box-sizing:border-box;width:480px;padding:32px;background:#ffffff;border-radius:16px;box-shadow:0px 20px 40px -10px rgba(0,0,0,0.3);display:flex;flex-direction:column;gap:20px;font-family:Inter,system-ui,sans-serif;color:#1e293b}
.dlg h2{margin:0;font-size:24px;line-height:32px;font-weight:800}
.dlg p{margin:0;font-size:15px;line-height:21px;color:#6b7280}
.dlg-actions{display:flex;justify-content:flex-end;gap:12px}
.opts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;border:0;min-width:0}
.opts legend{padding:0;margin:0 0 8px;font-size:14px;line-height:20px;font-weight:600;color:#1e293b}
.opt{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1px solid #d1d5db;border-radius:12px;background:#ffffff;font-size:15px;line-height:20px;color:#1e293b;cursor:pointer}
.opt:hover{background:#f8fafc}
.opt.is-on{border-color:#4f46e5;background:#e0e7ff}
.opt input{margin:0;flex:none;width:18px;height:18px;accent-color:#4f46e5}
</style>
</helmet>
<div style="position: relative; width: 768px; height: 1024px; box-sizing: border-box; background: #f8fafc; color: #1e293b; font-family: Inter, system-ui, sans-serif; display: flex; justify-content: center; overflow: hidden;">
<div style="flex: none; width: 88px; height: 1024px; box-sizing: border-box; padding: 12px 0 16px; display: flex; flex-direction: column; align-items: center;">
<div style="display: flex; padding: 7px 0;"><x-import component-from-global-scope="YDS.YLogo" size="36"></x-import></div>
<nav aria-label="Navigation principale" style="display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 4px;">
<x-import component-from-global-scope="YDS.RailItem" icon="home" label="Accueil" active="{{yes}}"></x-import>
<x-import component-from-global-scope="YDS.RailItem" icon="search" label="Explorer"></x-import>
<x-import component-from-global-scope="YDS.RailItem" icon="bell" label="Notifications" badge="3"></x-import>
<x-import component-from-global-scope="YDS.RailItem" icon="mail" label="Messages"></x-import>
<x-import component-from-global-scope="YDS.RailItem" icon="bookmark" label="Signets"></x-import>
<x-import component-from-global-scope="YDS.RailItem" icon="user" label="Profil"></x-import>
<x-import component-from-global-scope="YDS.RailItem" icon="circle-ellipsis" label="Plus"></x-import>
</nav>
<div style="margin-top: 16px;"><x-import component-from-global-scope="YDS.RailPoster"></x-import></div>
<button type="button" aria-label="Options du compte Corentin Laborie" style="margin-top: auto; width: 50px; height: 50px; padding: 0; border: 0; border-radius: 9999px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer;"><x-import component-from-global-scope="YDS.Avatar" name="Corentin Laborie" size="40"></x-import></button>
</div>

<main style="flex: none; width: 600px; height: 1024px; box-sizing: border-box; border-left: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0; overflow: hidden; background: #ffffff; display: flex; flex-direction: column;">
<div role="tablist" style="display: flex; border-bottom: 1px solid #e2e8f0; height: 53px; box-sizing: border-box; background: #ffffff; flex: none;">
<x-import component-from-global-scope="YDS.Tab" label="Pour vous" active="{{yes}}" style="flex: 1;"></x-import>
</div>
<div class="ph-post"><span class="ph-av"></span><div class="ph-col"><span class="ph-bar w40"></span><span class="ph-bar w90"></span><span class="ph-bar w70"></span></div></div>
<div class="ph-post"><span class="ph-av"></span><div class="ph-col"><span class="ph-bar w40"></span><span class="ph-bar w90"></span><span class="ph-bar w70"></span></div></div>
<div class="ph-post"><span class="ph-av"></span><div class="ph-col"><span class="ph-bar w40"></span><span class="ph-bar w90"></span></div></div>
</main>

<div class="scrim">
<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
<h2 id="dlg-title">Signaler cette question</h2>
<p>Choisissez le motif qui correspond le mieux à cette question.</p>
<fieldset class="opts">
<legend>Motif du signalement</legend>
<label class="opt"><input type="radio" name="motif" value="spam">Spam</label>
<label class="opt"><input type="radio" name="motif" value="harcelement">Harcèlement</label>
<label class="opt"><input type="radio" name="motif" value="haine">Propos haineux</label>
<label class="opt"><input type="radio" name="motif" value="illicite">Contenu illicite</label>
<label class="opt"><input type="radio" name="motif" value="desinformation">Désinformation</label>
<label class="opt is-on"><input type="radio" name="motif" value="autre" checked>Autre</label>
</fieldset>
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: -4px;">
<x-import component-from-global-scope="YDS.TextField" label="Précisez le motif (obligatoire)" hint="Expliquez en quelques mots pourquoi vous signalez cette question." placeholder="Décrivez le problème" multiline="{{yes}}" rows="3"></x-import>
<div style="display: flex; justify-content: flex-end;"><x-import component-from-global-scope="YDS.CharCounter" value="0" max="280"></x-import></div>
</div>
<div class="dlg-actions">
<x-import component-from-global-scope="YDS.Button" variant="outline" size="md">Annuler</x-import>
<x-import component-from-global-scope="YDS.Button" variant="primary" size="md" disabled="{{yes}}">Signaler</x-import>
</div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":768,"height":1024}}'>
class Component extends DCLogic {
renderVals() {
return { yes: true };
}
}
</script>
</body>
</html>
