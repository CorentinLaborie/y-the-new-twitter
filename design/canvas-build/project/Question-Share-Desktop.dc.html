<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Question partagée — Desktop</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/yds/components/bundle.css">
<script src="ds/yds/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#4f46e5}a:hover{color:#4338ca}
.y-qpost{padding:24px}
.y-qpost.is-compact{padding:16px 24px}
.y-qpost-who strong{font-size:15px}
.y-qpost-who span,.y-qpost-tags{font-size:12px}
.y-qpost-body{font-size:16px;line-height:24px;margin:16px 0}
.y-qpost.is-compact .y-qpost-body{font-size:16px;line-height:24px;margin:16px 0}
.y-qpost-actions{gap:12px}
.y-qpost-head{gap:12px}
.y-qpost-head .y-avatar{width:40px!important;height:40px!important;font-size:16px!important}
.y-react{height:32px;padding:0 16px;font-size:14px;white-space:nowrap}
.y-follow{height:32px!important;font-size:12px!important}
.y-save{width:32px;height:32px}
.y-account{margin-top:auto;display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;padding:12px 12px 12px 8px;border:0;border-radius:9999px;background:transparent;font-family:inherit;text-align:left;cursor:pointer}
.y-account:hover{background:#f3f4f6}
.y-sharebar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px;border-bottom:1px solid #e2e8f0;background:#ffffff}
.y-sharebar p{margin:0;font-size:14px;line-height:20px;font-weight:700;color:#6b7280}
.y-sharebar a{font-size:14px;line-height:20px;font-weight:700}
.y-feed{display:flex;flex-direction:column;gap:12px;padding:16px 16px 0}
</style>
</helmet>
<div style="width: 1440px; height: 1073px; box-sizing: border-box; background: #f8fafc; color: #1e293b; font-family: Inter, system-ui, sans-serif; display: flex; justify-content: flex-start; padding-left: 108px; overflow: hidden;">

<div style="flex: none; width: 275px; box-sizing: border-box; padding: 8px 24px 16px 8px; display: flex; flex-direction: column; height: 1073px;">
<div style="padding: 4px 8px 8px;"><x-import component-from-global-scope="YDS.YLogo" size="40"></x-import></div>
<nav aria-label="Navigation principale" style="display: flex; flex-direction: column; gap: 8px; margin-left: -8px;">
<x-import component-from-global-scope="YDS.NavItem" icon="home" label="Accueil"></x-import>
<x-import component-from-global-scope="YDS.NavItem" icon="search" label="Explorer"></x-import>
<x-import component-from-global-scope="YDS.NavItem" icon="bell" label="Notifications" badge="3"></x-import>
<x-import component-from-global-scope="YDS.NavItem" icon="mail" label="Messages"></x-import>
<x-import component-from-global-scope="YDS.NavItem" icon="bookmark" label="Signets"></x-import>
<x-import component-from-global-scope="YDS.NavItem" icon="user" label="Profil"></x-import>
<x-import component-from-global-scope="YDS.NavItem" icon="circle-ellipsis" label="Plus"></x-import>
</nav>
<div style="margin-top: 24px;"><x-import component-from-global-scope="YDS.Button" variant="primary" size="lg" shape="pill" block="{{yes}}">Poster</x-import></div>
<button type="button" class="y-account" aria-label="Options du compte Corentin Laborie">
<span style="flex: none; width: 40px; height: 40px; display: flex;"><x-import component-from-global-scope="YDS.Avatar" name="Corentin Laborie" size="{{av}}"></x-import></span>
<span style="flex: 1; min-width: 0; line-height: 18px;"><span style="display: block; font-size: 15px; font-weight: 700; color: #1e293b;">Corentin Laborie</span><span style="display: block; font-size: 15px; color: #6b7280;">@corentin</span></span>
<x-import component-from-global-scope="YDS.Icon" name="ellipsis" size="18" color="#1e293b"></x-import>
</button>
</div>

<main style="flex: none; width: 600px; height: 1073px; box-sizing: border-box; border-left: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0; overflow: hidden; background: #ffffff; display: flex; flex-direction: column;">
<div class="y-sharebar" role="region" aria-label="Vue partagée">
<p>Vue partagée</p>
<a href="#">Ouvrir le fil</a>
</div>
<x-import component-from-global-scope="YDS.PageHeader" back="{{yes}}" backLabel="Retour" title="Question"></x-import>

<div class="y-feed">
<x-import component-from-global-scope="YDS.QuestionPost" author="AliceY" date="15/10/2026 08h30" tags="{{pA.tags}}" body="{{pA.body}}" reactions="{{pA.reactions}}" bookmarkable="{{yes}}">
<x-import component-from-global-scope="YDS.ConversationBox" reply-to="AliceY">
<x-import component-from-global-scope="YDS.QuestionPost" author="MarkL" date="15/10/2026 09h02" followed="{{yes}}" body="{{replyA.body}}" reactions="{{replyA.reactions}}" compact="{{yes}}"></x-import>
</x-import>
</x-import>
</div>
</main>

<div style="flex: none; width: 350px; box-sizing: border-box; padding: 8px 0 16px 24px; display: flex; flex-direction: column; gap: 16px; height: 1073px; overflow: hidden;">
<x-import component-from-global-scope="YDS.SearchField" show-label="{{yes}}" label="Rechercher une question ou un #hashtag" placeholder="Ex.&nbsp;: #slow_social, débat, AliceY…"></x-import>
<x-import component-from-global-scope="YDS.Footer" variant="sidebar"></x-import>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1073}}'>
class Component extends DCLogic {
renderVals() {
return {
yes: true,
av: 40,
pA: { tags: ['#human_life'], body: '« Est-ce qu’on change vraiment d’avis, ou est-ce qu’on trouve juste de meilleures raisons de penser la même chose ? »', reactions: { like: 860, dislike: 95, y: 64 } },
replyA: { body: 'Je crois qu’on change d’avis quand on arrête de vouloir gagner la discussion.', reactions: { like: 58, dislike: 4 } }
};
}
}
</script>
</body>
</html>
