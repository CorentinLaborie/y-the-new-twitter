<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Hashtag — Tablet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/yds/components/bundle.css">
<script src="ds/yds/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#4f46e5}a:hover{color:#4338ca}
.y-qpost{padding:24px}
.y-qpost.is-compact{padding:16px 24px}
.y-qpost-who strong{font-size:15px}
.y-qpost-who span,.y-qpost-tags{font-size:12px}
.y-qpost-body{font-size:16px;line-height:24px;margin:16px 0}
.y-qpost.is-compact .y-qpost-body{font-size:16px;line-height:24px;margin:16px 0}
.y-qpost-actions{gap:12px}
.y-qpost-head{gap:12px}
.y-qpost-head .y-avatar{width:40px!important;height:40px!important;font-size:16px!important}
.y-react{height:32px;padding:0 16px;font-size:14px;white-space:nowrap}
.y-follow{height:32px!important;font-size:12px!important}
.y-save{width:32px;height:32px}
.y-account{margin-top:auto;display:flex;align-items:center;justify-content:center;width:50px;height:50px;padding:0;border:0;border-radius:9999px;background:transparent;cursor:pointer}
.y-feed{display:flex;flex-direction:column;gap:12px;padding:16px 16px 0}
.y-more{padding:16px 24px}
</style>
</helmet>
<div style="width: 768px; height: 1024px; box-sizing: border-box; background: #f8fafc; color: #1e293b; font-family: Inter, system-ui, sans-serif; display: flex; justify-content: center; overflow: hidden;">
<div style="flex: none; width: 88px; height: 1024px; box-sizing: border-box; padding: 12px 0 16px; display: flex; flex-direction: column; align-items: center;">
<div style="display: flex; padding: 8px 0;"><x-import component-from-global-scope="YDS.YLogo" size="36"></x-import></div>
<nav aria-label="Navigation principale" style="display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 4px;">
<x-import component-from-global-scope="YDS.RailItem" icon="home" label="Accueil"></x-import>
<x-import component-from-global-scope="YDS.RailItem" icon="search" label="Explorer" active="{{yes}}"></x-import>
<x-import component-from-global-scope="YDS.RailItem" icon="bell" label="Notifications" badge="3"></x-import>
<x-import component-from-global-scope="YDS.RailItem" icon="mail" label="Messages"></x-import>
<x-import component-from-global-scope="YDS.RailItem" icon="bookmark" label="Signets"></x-import>
<x-import component-from-global-scope="YDS.RailItem" icon="user" label="Profil"></x-import>
<x-import component-from-global-scope="YDS.RailItem" icon="circle-ellipsis" label="Plus"></x-import>
</nav>
<div style="margin-top: 16px;"><x-import component-from-global-scope="YDS.RailPoster"></x-import></div>
<button type="button" class="y-account" aria-label="Options du compte Corentin Laborie"><span style="width: 40px; height: 40px; display: flex;"><x-import component-from-global-scope="YDS.Avatar" name="Corentin Laborie" size="{{av}}"></x-import></span></button>
</div>
<main style="flex: none; width: 600px; height: 1024px; box-sizing: border-box; border-left: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0; overflow: hidden; background: #ffffff; display: flex; flex-direction: column;">
<x-import component-from-global-scope="YDS.PageHeader" back="{{yes}}" backLabel="Retour à l’explorateur" title="#online_life" subtitle="{{hashCount}}"></x-import>

<div class="y-feed" aria-label="Questions avec le hashtag #online_life">
<x-import component-from-global-scope="YDS.QuestionPost" author="MarkL" date="14/10/2026 16h32" tags="{{postB.tags}}" body="{{postB.body}}" reactions="{{postB.reactions}}" followed="{{yes}}" bookmarkable="{{yes}}" saved="{{yes}}"></x-import>
<x-import component-from-global-scope="YDS.QuestionPost" author="AliceY" date="14/10/2026 10h41" tags="{{pB.tags}}" body="{{pB.body}}" reactions="{{pB.reactions}}" bookmarkable="{{yes}}"></x-import>
</div>

<div class="y-more"><x-import component-from-global-scope="YDS.LoadMore" label="Voir plus de questions"></x-import></div>
</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":768,"height":1024}}'>
class Component extends DCLogic {
renderVals() {
return {
yes: true,
av: 40,
hashCount: '2 000 questions',
postB: { tags: ['#slow_social', '#online_life'], body: '« Si on ne pouvait poster qu’une question par jour, est-ce qu’on réfléchirait davantage avant d’écrire ? »', reactions: { like: 842, dislike: 97, y: 41 } },
pB: { tags: ['#online_life', '#irl_vs_online'], body: '« Pourquoi les gens préfèrent-ils les réponses rapides plutôt que les questions profondes ? »', reactions: { like: 124, dislike: 12, y: 49 } }
};
}
}
</script>
</body>
</html>
