<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>App — Tablet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/yds/components/bundle.css">
<script src="ds/yds/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#4f46e5}a:hover{color:#4338ca}
.y-qpost{padding:24px 24px 22px}
.y-qpost.is-compact{padding:18px 24px 16px}
.y-qpost-who strong{font-size:15px}
.y-qpost-who span{font-size:11px}
.y-qpost-tags{font-size:11px}
.y-qpost-body{font-size:16px;line-height:22px;margin:17px 0 18px}
.y-qpost.is-compact .y-qpost-body{font-size:16px;line-height:22px;margin:15px 0 16px}
.y-qpost-actions{gap:12px}
.y-react{height:32px;padding:0 16px;font-size:14px}
.y-qpost-head{gap:12px}
.y-qpost-head .y-avatar{width:40px!important;height:40px!important;font-size:16px!important}
.y-follow{height:26px!important;font-size:11px!important}
.y-react{white-space:nowrap}
.y-save{width:32px;height:32px}
.y-side-card{background:#ffffff;border-radius:16px;box-shadow:0px 4px 8px -1px rgba(0,0,0,0.1);padding:16px 24px}
.y-side-card h2{margin:0 0 8px;font-size:20px;line-height:26px;font-weight:700;color:#1e293b}
.y-trend{display:block;padding:8px 0;border-bottom:1px solid #e2e8f0;text-decoration:none}
.y-trend:last-child{border-bottom:0;padding-bottom:0}
.y-trend strong{display:block;font-size:15px;line-height:20px;font-weight:700;color:#4f46e5}
.y-trend span{display:block;font-size:12px;line-height:16px;color:#6b7280}
.y-user-row{display:flex;align-items:center;gap:12px;padding:8px 0}
.y-user-row:last-child{padding-bottom:0}
.y-user-row-text{flex:1;min-width:0;line-height:18px}
.y-user-row-text strong{display:block;font-size:15px;font-weight:700;color:#1e293b}
.y-user-row-text span{display:block;font-size:12px;color:#6b7280}
.y-account{margin-top:auto;display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;padding:12px 12px 12px 12px;border:0;border-radius:9999px;background:transparent;font-family:inherit;text-align:left;cursor:pointer}
.y-account:hover{background:#f3f4f6}
</style>
</helmet>
<div style="width: 768px; height: 1024px; box-sizing: border-box; background: #f8fafc; color: #1e293b; font-family: Inter, system-ui, sans-serif; display: flex; justify-content: center; overflow: hidden;">
<div style="flex: none; width: 88px; height: 1024px; box-sizing: border-box; padding: 12px 0 16px; display: flex; flex-direction: column; align-items: center;">
<div style="display: flex; padding: 7px 0;"><x-import component-from-global-scope="YDS.YLogo" size="36"></x-import></div>
<nav aria-label="Navigation principale" style="display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 4px;">
<x-import component-from-global-scope="YDS.RailItem" icon="home" label="Accueil" active="{{yes}}"></x-import>
<x-import component-from-global-scope="YDS.RailItem" icon="search" label="Explorer"></x-import>
<x-import component-from-global-scope="YDS.RailItem" icon="bell" label="Notifications" badge="3"></x-import>
<x-import component-from-global-scope="YDS.RailItem" icon="mail" label="Messages"></x-import>
<x-import component-from-global-scope="YDS.RailItem" icon="bookmark" label="Signets"></x-import>
<x-import component-from-global-scope="YDS.RailItem" icon="user" label="Profil"></x-import>
<x-import component-from-global-scope="YDS.RailItem" icon="circle-ellipsis" label="Plus"></x-import>
</nav>
<div style="margin-top: 16px;"><x-import component-from-global-scope="YDS.RailPoster"></x-import></div>
<button type="button" aria-label="Options du compte Corentin Laborie" style="margin-top: auto; width: 50px; height: 50px; padding: 0; border: 0; border-radius: 9999px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer;"><span style="width: 40px; height: 40px; display: flex;"><x-import component-from-global-scope="YDS.Avatar" name="Corentin Laborie" size="{{av}}"></x-import></span></button>
</div>
<main style="flex: none; width: 600px; height: 1024px; box-sizing: border-box; border-left: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0; overflow: hidden; background: #ffffff; display: flex; flex-direction: column;">
<div role="tablist" style="display: flex; border-bottom: 1px solid #e2e8f0; height: 53px; box-sizing: border-box; background: #ffffff; flex: none;">
<x-import component-from-global-scope="YDS.Tab" label="Pour vous" active="{{yes}}" style="flex: 1;"></x-import>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 0;">

<section style="background: #f8fafc; border-radius: 16px; padding: 16px 24px; display: flex; gap: 12px;">
<div style="flex: none; width: 40px; height: 40px; display: flex;"><x-import component-from-global-scope="YDS.Avatar" name="Corentin Laborie" size="{{av}}"></x-import></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px;">
<label for="ask" style="font-size: 13px; font-weight: 700; color: #1e293b;">Posez votre question</label>
<textarea id="ask" placeholder="Quelle est votre question&nbsp;?" style="display: block; width: 100%; height: 72px; box-sizing: border-box; padding: 12px 12px; border: 1px solid #e2e8f0; border-radius: 8px; background: #ffffff; font-family: inherit; font-size: 15px; color: #1e293b; resize: none;"></textarea>
<div style="display: flex; align-items: center; justify-content: space-between;">
<div style="display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: #4f46e5;"><x-import component-from-global-scope="YDS.Icon" name="globe" size="16" color="#4f46e5"></x-import><span>Tout le monde peut répondre</span></div>
<div style="display: flex; align-items: center; gap: 12px;"><x-import component-from-global-scope="YDS.CharCounter" value="0" max="280"></x-import><x-import component-from-global-scope="YDS.Button" variant="primary" size="md" disabled="{{yes}}">Poster</x-import></div>
</div>
</div>
</section>

<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 32px; flex: none; border: 1px solid #4f46e5; border-radius: 9999px; background: #ffffff; color: #4f46e5; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;"><x-import component-from-global-scope="YDS.Icon" name="plus" size="14" color="#4f46e5"></x-import>Afficher 12 nouvelles questions</button>

<x-import component-from-global-scope="YDS.QuestionPost" author="AliceY" date="14/10/2026 10h41" tags="{{postA.tags}}" body="{{postA.body}}" reactions="{{postA.reactions}}" bookmarkable="{{yes}}"></x-import>

<x-import component-from-global-scope="YDS.QuestionPost" author="Juliette_B" date="14/10/2026 09h12" tags="{{postB.tags}}" body="{{postB.body}}" reactions="{{postB.reactions}}" followed="{{yes}}" y-active="{{yes}}" bookmarkable="{{yes}}" saved="{{yes}}">
<x-import component-from-global-scope="YDS.ConversationBox" reply-to="Juliette_B">
<x-import component-from-global-scope="YDS.QuestionPost" author="AliceY" date="14/10/2026 09h41" body="{{replyA.body}}" reactions="{{replyA.reactions}}" compact="{{yes}}"></x-import>
</x-import>
</x-import>

<x-import component-from-global-scope="YDS.QuestionPost" author="Robert44" date="13/10/2026 18h44" tags="{{postC.tags}}" body="{{postC.body}}" reactions="{{postC.reactions}}" bookmarkable="{{yes}}"></x-import>

</div>
</main>

</div>
</x-dc>

yes: true,
av: 40,
postA: { tags: ['#online_life', '#irl_vs_online'], body: '«\u00a0Pourquoi les gens préfèrent-ils les réponses rapides plutôt que les questions profondes ?\u00a0»', reactions: { like: 124, dislike: 12, y: 49 } },
postB: { tags: ['#online_life', '#irl_vs_online'], body: '«\u00a0Qu’est-ce qui fait qu’une conversation en ligne peut être plus sincère qu’une rencontre en personne ?\u00a0»', reactions: { like: 2000, dislike: 450, y: 89 } },

postC: { tags: ['#online_life', '#irl_vs_online'], body: '«\u00a0Like pour les bananes, dislike pour les pommes : quel est le meilleur fruit ?\u00a0»', reactions: { like: 500, dislike: 480, y: 47 } }
};
}
}
</script>
</body>
</html>
