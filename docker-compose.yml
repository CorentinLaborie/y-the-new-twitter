services:
  postgres:
    # PostgreSQL 18.6, pinned by digest (DEC-126). Upgrade the patch on purpose, never by tag.
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-y}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-y-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-y}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-y} -d ${POSTGRES_DB:-y}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
