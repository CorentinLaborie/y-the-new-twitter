openapi: 3.0.0
paths:
  /api/v1/status:
    get:
      operationId: AppController_status
      parameters: []
      responses:
        "200":
          description: ""
      tags:
        - App
  /api/v1/auth/signup:
    post:
      operationId: SignupController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupDto"
      responses:
        "202":
          description: ""
      tags: &a1
        - Signup
  /api/v1/auth/signup/verify:
    post:
      operationId: SignupController_verify
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifySignupDto"
      responses:
        "200":
          description: ""
      tags: *a1
  /api/v1/auth/signup/resend:
    post:
      operationId: SignupController_resend
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendSignupDto"
      responses:
        "202":
          description: ""
      tags: *a1
  /api/v1/auth/login:
    post:
      operationId: LoginController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        "200":
          description: The user, with a SESSION cookie.
        "401":
          description: Wrong e-mail or password. Also the answer while the account is
            locked after 5 failures, so the lock is not revealed.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "403":
          description: The e-mail address is not verified yet (code
            account_pending_verification).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "429":
          description: Too many requests from this IP address (20 attempts in 15 minutes).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - Login
  /api/v1/auth/session:
    get:
      operationId: SessionController_current
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSessionResponseDto"
      tags: &a2
        - Session
  /api/v1/auth/logout:
    post:
      operationId: SessionController_logout
      parameters: []
      responses:
        "204":
          description: ""
      tags: *a2
  /api/v1/auth/password-reset/request:
    post:
      operationId: PasswordResetController_request
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestDto"
      responses:
        "202":
          description: ""
      tags: &a3
        - PasswordReset
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: PasswordResetController_confirm
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmDto"
      responses:
        "200":
          description: ""
      tags: *a3
  /api/v1/auth/email-change/request:
    post:
      operationId: EmailChangeController_request
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChangeRequestDto"
      responses:
        "422":
          description: The current password is wrong.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags: &a4
        - EmailChange
  /api/v1/auth/email-change/resend:
    post:
      operationId: EmailChangeController_resend
      parameters: []
      responses:
        "429":
          description: More than three resends in an hour.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags: *a4
  /api/v1/auth/email-change/confirm:
    post:
      operationId: EmailChangeController_confirm
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChangeConfirmDto"
      responses:
        "200":
          description: ""
      tags: *a4
  /api/v1/users/me/deletion:
    put:
      operationId: AccountDeletionController_requestDeletion
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletionDto"
      responses:
        "422":
          description: The current password is wrong.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - AccountDeletion
  /api/v1/users/me/password:
    put:
      operationId: PasswordChangeController_change
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeDto"
      responses:
        "401":
          description: Not logged in.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "403":
          description: The account is not active (suspended, pending verification or
            pending deletion).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "422":
          description: The current password is wrong, or the new one does not meet the
            policy.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "429":
          description: Too many requests.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - PasswordChange
  /api/v1/users/me/account:
    get:
      operationId: AccountSettingsController_read
      parameters: []
      responses:
        "200":
          description: The viewer’s account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSettingsDto"
        "401":
          description: Not logged in.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "403":
          description: The account is not active (suspended, pending verification or
            pending deletion).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - AccountSettings
  /api/v1/questions/{questionId}:
    get:
      operationId: QuestionsController_findOne
      parameters:
        - name: questionId
          required: true
          in: path
          schema:
            format: uuid
            type: string
      responses:
        "200":
          description: The question, as the feed returns it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionResponseDto"
        "400":
          description: The question id is not a UUID.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "401":
          description: Not logged in.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "403":
          description: The account is not active (suspended, pending verification or
            pending deletion).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "404":
          description: The question does not exist, or it is hidden, deleted or blocked.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "429":
          description: Too many requests.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags: &a5
        - Questions
  /api/v1/questions:
    post:
      operationId: QuestionsController_create
      parameters:
        - name: idempotency-key
          in: header
          description: "Repeated with the same text, returns the first response. Same key,
            other text: 422 (section 9.1)."
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestionDto"
      responses:
        "201":
          description: The question.
          headers:
            Location:
              description: Path of the new question.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionResponseDto"
        "400":
          description: Malformed request, such as an empty Idempotency-Key.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "401":
          description: Not logged in.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "403":
          description: The account is not active (suspended, pending verification or
            pending deletion).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "422":
          description: The text is empty or longer than 280 characters, or the key was
            used for another text.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "429":
          description: Too many requests.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags: *a5
  /api/v1/questions/{questionId}/reactions/{kind}:
    put:
      operationId: ReactionsController_set
      parameters:
        - name: questionId
          required: true
          in: path
          schema:
            type: string
        - name: kind
          required: true
          in: path
          schema:
            enum:
              - like
              - dislike
              - y
            type: string
      responses:
        "200":
          description: The counters after the reaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactionResponseDto"
        "400":
          description: The question id is not a UUID, or the kind is not like, dislike or y.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "401":
          description: Not logged in.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "403":
          description: The account is not active (suspended, pending verification or
            pending deletion).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "404":
          description: The question does not exist, or it is hidden or deleted.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "429":
          description: Too many requests.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags: &a6
        - Reactions
    delete:
      operationId: ReactionsController_remove
      parameters:
        - name: questionId
          required: true
          in: path
          schema:
            type: string
        - name: kind
          required: true
          in: path
          schema:
            enum:
              - like
              - dislike
              - y
            type: string
      responses:
        "204":
          description: The reaction of this kind was removed, or there was none.
        "400":
          description: The question id is not a UUID, or the kind is not like, dislike or y.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "401":
          description: Not logged in.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "403":
          description: The account is not active (suspended, pending verification or
            pending deletion).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "404":
          description: The question does not exist, or it is hidden, deleted or blocked.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "429":
          description: Too many requests.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags: *a6
  /api/v1/questions/{questionId}/replies:
    post:
      operationId: RepliesController_create
      parameters:
        - name: questionId
          required: true
          in: path
          schema:
            type: string
        - name: idempotency-key
          in: header
          description: Repeated with the same text on the same question, returns the first
            reply. Section 9.1.
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReplyDto"
      responses:
        "201":
          description: The reply.
          headers:
            Location:
              description: Path of the new reply.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyResponseDto"
        "400":
          description: The question id is not a UUID, or the Idempotency-Key is empty or
            too long.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "401":
          description: Not logged in.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "403":
          description: The account is not active (suspended, pending verification or
            pending deletion).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "404":
          description: The question does not exist, or it is hidden, deleted or blocked.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "422":
          description: The text is empty or longer than 280 characters, the conversation
            is not open yet, or the key was used for another request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "429":
          description: Too many requests.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags: &a7
        - Replies
    get:
      operationId: RepliesController_list
      parameters:
        - name: questionId
          required: true
          in: path
          schema:
            type: string
        - name: cursor
          required: false
          in: query
          description: nextCursor of the previous page. Absent for the first page.
          schema:
            maxLength: 512
            type: string
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 50
            default: 20
            type: number
      responses:
        "200":
          description: One page of replies, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyPageDto"
        "400":
          description: The question id is not a UUID, the cursor is invalid, or the limit
            is out of range.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "401":
          description: Not logged in.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "403":
          description: The account is not active (suspended, pending verification or
            pending deletion).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "404":
          description: The question does not exist, or it is hidden, deleted or blocked.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags: *a7
  /api/v1/replies/{replyId}:
    delete:
      operationId: RepliesController_remove
      parameters:
        - name: replyId
          required: true
          in: path
          schema:
            type: string
      responses:
        "204":
          description: The reply was deleted.
        "400":
          description: The reply id is not a UUID.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "401":
          description: Not logged in.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "404":
          description: The reply does not exist, was already deleted, or belongs to
            another account.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags: *a7
  /api/v1/replies/{replyId}/reactions/{kind}:
    put:
      operationId: ReplyReactionsController_set
      parameters:
        - name: replyId
          required: true
          in: path
          schema:
            type: string
        - name: kind
          required: true
          in: path
          schema:
            enum:
              - like
              - dislike
            type: string
      responses:
        "200":
          description: The counters after the reaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyReactionResponseDto"
        "400":
          description: The reply id is not a UUID, or the kind is not like or dislike.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "401":
          description: Not logged in.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "403":
          description: The account is not active (suspended, pending verification or
            pending deletion).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "404":
          description: The reply does not exist, or it is hidden, deleted or blocked.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "429":
          description: Too many requests.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags: &a8
        - ReplyReactions
    delete:
      operationId: ReplyReactionsController_remove
      parameters:
        - name: replyId
          required: true
          in: path
          schema:
            type: string
        - name: kind
          required: true
          in: path
          schema:
            enum:
              - like
              - dislike
            type: string
      responses:
        "204":
          description: The reaction of this kind was removed, or there was none.
        "400":
          description: The reply id is not a UUID, or the kind is not like or dislike.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "401":
          description: Not logged in.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "403":
          description: The account is not active (suspended, pending verification or
            pending deletion).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "404":
          description: The reply does not exist, or it is hidden, deleted or blocked.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "429":
          description: Too many requests.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags: *a8
  /api/v1/users/{handle}/block:
    put:
      operationId: BlocksController_block
      parameters:
        - name: handle
          required: true
          in: path
          schema:
            maxLength: 30
            example: alice
            type: string
      responses:
        "204":
          description: The account is blocked. Blocking it again changes nothing.
        "400":
          description: The handle is not a valid handle.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "401":
          description: Not logged in.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "403":
          description: The account is not active (suspended, pending verification or
            pending deletion).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "404":
          description: No active account has this handle.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "422":
          description: The viewer tries to block their own account.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "429":
          description: Too many requests.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags: &a9
        - Blocks
    delete:
      operationId: BlocksController_unblock
      parameters:
        - name: handle
          required: true
          in: path
          schema:
            maxLength: 30
            example: alice
            type: string
      responses:
        "204":
          description: The block is lifted, or there was none.
        "400":
          description: The handle is not a valid handle.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "401":
          description: Not logged in.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "403":
          description: The account is not active (suspended, pending verification or
            pending deletion).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags: *a9
  /api/v1/users/me/blocks:
    get:
      operationId: BlocksController_list
      parameters:
        - name: cursor
          required: false
          in: query
          description: nextCursor of the previous page. Absent for the first page.
          schema:
            maxLength: 512
            type: string
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 50
            default: 20
            allOf:
              - $ref: "#/components/schemas/Object"
      responses:
        "200":
          description: One page of the accounts the viewer blocks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockPageDto"
        "400":
          description: The cursor or the limit is not valid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "401":
          description: Not logged in.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "403":
          description: The account is not active (suspended, pending verification or
            pending deletion).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags: *a9
  /api/v1/reports:
    post:
      operationId: ReportsController_create
      parameters:
        - name: idempotency-key
          in: header
          description: Repeated with the same report, returns the first one. Section 9.1.
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportDto"
      responses:
        "201":
          description: The report, open.
          headers:
            Location:
              description: Path of the new report.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponseDto"
        "400":
          description: Not exactly one of questionId and replyId, a UUID is invalid, the
            reason is not in the list, or the body is invalid.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "401":
          description: Not logged in.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "403":
          description: The account is not active (suspended, pending verification or
            pending deletion).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "404":
          description: The content does not exist, or it is hidden, deleted or blocked.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "422":
          description: The reason is other and the details are missing, the details are
            longer than 280 characters, the reported content is the viewer’s
            own, or the key was used for another request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - Reports
  /api/v1/feed:
    get:
      operationId: FeedController_page
      parameters:
        - name: tab
          required: true
          in: query
