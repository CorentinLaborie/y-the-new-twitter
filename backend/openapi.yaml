  /health:
    get:
      operationId: HealthController_check
      parameters: []
      responses:
        "200":
          description: The Health Check is successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  info:
                    type: object
                    example: &a13
                      database:
                        status: up
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example: {}
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example: *a13
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
        "503":
          description: The Health Check is not successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  info:
                    type: object
                    example:
                      database: &a14
                        status: up
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example:
                      redis: &a15
                        status: down
                        message: Could not connect
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example:
                      database: *a14
                      redis: *a15
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
      tags:
        - Health
info:
  title: Y API
  description: ""
  version: "1"
  contact: {}
tags: []
servers: []
components:
  schemas:
    SignupDto:
      type: object
      properties: {}
    VerifySignupDto:
      type: object
      properties: {}
    ResendSignupDto:
      type: object
      properties: {}
    ProblemDetailsDto:
      type: object
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Unprocessable Entity
        status:
          type: number
          example: 422
        detail:
          type: string
          example: La question doit contenir de 1 à 280 caractères.
        instance:
          type: string
          example: /api/v1/questions
        requestId:
          type: string
        code:
          type: string
          example: account_suspended
          description: "Stable machine-readable code of the refusal, when it has one:
            account_pending_verification, account_suspended,
            account_pending_deletion, csrf_invalid or reauth_required. The
            detail text is in French and may change."
      required:
        - type
        - title
        - status
        - detail
        - instance
    LoginDto:
      type: object
      properties: {}
    CurrentUserDto:
      type: object
      properties:
        handle:
          type: string
          example: alice
        displayName:
          type: string
          example: Alice
        status:
          type: string
          enum:
            - pending_verification
            - active
            - suspended
            - pending_deletion
            - deleted
          example: active
          description: Status of the account. A suspended account still gets its session
            (section 3.4).
        suspensionReason:
          type: string
          nullable: true
          example: Spam répété.
          description: Reason of the suspension (DEC-077). Set only when status is
            suspended, null otherwise, even if a reason was stored before.
      required:
        - handle
        - displayName
        - status
        - suspensionReason
    CurrentSessionResponseDto:
      type: object
      properties:
        user:
          nullable: true
          type: object
          allOf:
            - $ref: "#/components/schemas/CurrentUserDto"
      required:
        - user
    PasswordResetRequestDto:
      type: object
      properties: {}
    PasswordResetConfirmDto:
      type: object
      properties: {}
    EmailChangeRequestDto:
      type: object
      properties: {}
    EmailChangeConfirmDto:
      type: object
      properties: {}
    AccountDeletionDto:
      type: object
      properties: {}
    PasswordChangeDto:
      type: object
      properties: {}
    AccountSettingsDto:
      type: object
      properties:
        handle:
          type: string
          example: alice
        displayName:
          type: string
          example: Alice Martin
        email:
          type: string
          format: email
        status:
          type: string
          example: active
        deletionPurgeAt:
          type: string
          format: date-time
          nullable: true
      required:
        - handle
        - displayName
        - email
        - status
        - deletionPurgeAt
    QuestionAuthorDto:
      type: object
      properties:
        handle:
          type: string
          example: alice
        displayName:
          type: string
          example: Alice
        viewerFollows:
          type: boolean
          example: false
          description: True when the signed-in viewer follows this author. False for the
            viewer’s own questions (L3).
      required:
        - handle
        - displayName
        - viewerFollows
    QuestionCountersDto:
      type: object
      properties:
        like:
          type: number
          example: 0
        dislike:
          type: number
          example: 0
        y:
          type: number
          example: 0
        reply:
          type: number
          example: 0
      required:
        - like
        - dislike
        - y
        - reply
    QuestionResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          maxLength: 280
        createdAt:
          type: string
          format: date-time
        author:
          $ref: "#/components/schemas/QuestionAuthorDto"
        hashtags:
          example:
            - online_life
          description: "Without the #, lowercase."
          type: array
          items:
            type: string
        counters:
          $ref: "#/components/schemas/QuestionCountersDto"
        yThreshold:
          type: number
          example: 50
          description: "Y_CONVERSATION_THRESHOLD: the Y count that opens the conversation
            (R3)."
        conversationOpen:
          type: boolean
          example: false
          description: True once the Y count has reached yThreshold. It stays true if the
            count drops (R13).
        viewerReactions:
          type: array
          maxItems: 1
          description: The reaction of the signed-in viewer on this question, at most one
            (R11). Empty for anonymous views.
          items:
            type: string
            enum:
              - like
              - dislike
              - y
      required:
        - id
        - text
        - createdAt
        - author
        - hashtags
        - counters
        - yThreshold
        - conversationOpen
        - viewerReactions
    CreateQuestionDto:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 280
          description: Text of the question, trimmed. Counted in characters.
      required:
        - text
    ReactionCountsDto:
      type: object
      properties:
        like:
          type: number
          example: 124
        dislike:
          type: number
          example: 12
        y:
          type: number
          example: 49
      required:
        - like
        - dislike
        - y
    ReactionResponseDto:
      type: object
      properties:
        questionId:
          type: string
          format: uuid
        counters:
          $ref: "#/components/schemas/ReactionCountsDto"
        viewerReactions:
          type: array
          description: Empty when the viewer has no reaction.
          items:
            type: string
            enum:
              - like
              - dislike
              - y
        yThreshold:
          type: number
          example: 50
          description: "Y_CONVERSATION_THRESHOLD: the Y count that opens the conversation
            (R3)."
        conversationOpen:
          type: boolean
          example: true
          description: True once the Y count has reached yThreshold (R13).
      required:
        - questionId
        - counters
        - viewerReactions
        - yThreshold
        - conversationOpen
    CreateReplyDto:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 280
          description: Text of the reply, trimmed. Counted in characters.
      required:
        - text
    ReplyAuthorDto:
      type: object
      properties:
        handle:
          type: string
          example: alice
        displayName:
          type: string
          example: Alice
      required:
        - handle
        - displayName
    ReplyCountersDto:
      type: object
      properties:
        like:
          type: number
          example: 3
        dislike:
          type: number
          example: 0
      required:
        - like
        - dislike
    ReplyResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        questionId:
          type: string
          format: uuid
        text:
          type: string
          maxLength: 280
        createdAt:
          type: string
          format: date-time
        author:
          $ref: "#/components/schemas/ReplyAuthorDto"
        counters:
          $ref: "#/components/schemas/ReplyCountersDto"
        viewerReactions:
          type: array
          description: Empty when the viewer has none.
          items:
            type: string
            enum:
              - like
              - dislike
      required:
        - id
        - questionId
        - text
        - createdAt
        - author
        - counters
        - viewerReactions
    ReplyPageDto:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReplyResponseDto"
        nextCursor:
          type: string
          nullable: true
